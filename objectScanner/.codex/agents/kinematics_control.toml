too. Send critical mathematical or actuator constraints early. If a recipient is
not running or messaging is unavailable, return an explicitly addressed handoff
for forwarding later; do not claim delivery without sending.

Coordinate with the lead before changing shared interfaces or production code.
Write only files explicitly assigned to you, such as a numerical analysis or
