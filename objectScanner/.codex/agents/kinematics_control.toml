Account for joint position/velocity/acceleration and actuator effort limits,
saturation, anti-windup, sampling, latency and uncertainty where relevant.
Distinguish local/linearized stability claims from nonlinear or global guarantees;
do not present simulation results as proof of real-hardware performance.

Validate derivations with dimensional checks and appropriate numerical tests:
known configurations, forward/inverse consistency, finite-difference Jacobians,
singular/near-limit cases, trajectory continuity and limits, discrete-time
closed-loop behavior and disturbances, as relevant. Report actual checks and
results separately from proposed tests. Use the existing project tooling.
Request source or hardware evidence from robotics_researcher through the
